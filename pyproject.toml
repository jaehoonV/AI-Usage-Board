[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_usage_board"
version = "1.1.2"
description = "Windows desktop widget that shows remaining AI usage quota for Codex, Claude, Gemini and Antigravity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jaehoon" }]
# Standard library only: Codex goes through the official CLI, Claude and
# Gemini through a dedicated Chrome/Edge profile.
dependencies = []

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.6",
    "pytest>=8.0",
]

[project.gui-scripts]
ai_usage_board = "ai_usage_board.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_usage_board = ["resources/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
